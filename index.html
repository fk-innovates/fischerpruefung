<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4f49">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fischerprüfung">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fischerprüfung Bayern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: Handy-App – seegrünes Kopfband mit Logo + Fortschrittsring, eine Spalte mit Karten, feste Tab-Leiste unten */
:root{
  --bg:#edf3f1; --surface:#ffffff; --sunk:#f4f8f7; --ink:#122523; --muted:#5d716d; --line:#d6e2df;
  --lake:#0b4f49; --lake-2:#0f7a6d; --lake-soft:#dcefeb; --on-lake:#ffffff; --lure:#f08a3c;
  --ok:#1b7d48; --ok-soft:#e1f3e8; --bad:#b4261d; --bad-soft:#fbe4e2;
  --shadow:0 1px 2px rgba(18,37,35,.06),0 4px 14px rgba(18,37,35,.06);
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --tabh:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1615; --surface:#15211f; --sunk:#101b19; --ink:#e3eeeb; --muted:#93a8a3; --line:#253733;
  --lake:#0a3a35; --lake-2:#5cc9b6; --lake-soft:#173430; --on-lake:#ffffff; --lure:#f39a52;
  --ok:#5fd193; --ok-soft:#153325; --bad:#f28b81; --bad-soft:#3a1c1a; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1615; --surface:#15211f; --sunk:#101b19; --ink:#e3eeeb; --muted:#93a8a3; --line:#253733;
  --lake:#0a3a35; --lake-2:#5cc9b6; --lake-soft:#173430; --on-lake:#ffffff; --lure:#f39a52;
  --ok:#5fd193; --ok-soft:#153325; --bad:#f28b81; --bad-soft:#3a1c1a; --shadow:none; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 24px)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--lure);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--f-disp);font-weight:700;line-height:1.1;text-wrap:balance}
p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.inner{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kopf */
.top{background:var(--lake);color:var(--on-lake);margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:14px}
.top .inner{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;flex:none;border-radius:11px;overflow:hidden;display:block}
.top h1{font-size:24px;letter-spacing:.01em}
.top p{font-size:13px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .grow{flex:1;min-width:0}
.themeBtn{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--on-lake);background:rgba(255,255,255,.1)}
.ring{width:48px;height:48px;flex:none;position:relative}
.ring svg{display:block}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600}

main{padding-top:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:8px}
.sec-h h2{font-size:22px}
.muted{color:var(--muted)} .small{font-size:14px}

.big{font-family:var(--f-disp);font-size:52px;font-weight:700;line-height:1}
.bar{height:8px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex}
.bar>i{display:block;height:100%;background:var(--ok)}
.bar>i.w{background:var(--bad);opacity:.75}
.bar.thin{height:5px;border:0;background:var(--line)}
.bar.lake>i{background:var(--lake-2)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--lake-2);color:#fff;border-radius:12px;padding:13px 18px;font-weight:600;font-size:17px;min-height:50px;width:100%}
:root[data-theme="dark"] .btn:not(.ghost):not(.danger){color:#06201c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost):not(.danger){color:#06201c}}
.btn.ghost{background:transparent;color:var(--lake-2);box-shadow:inset 0 0 0 1.5px var(--lake-2)}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns.one{grid-template-columns:1fr}

/* Listen */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
button.li:active{background:var(--sunk)}
.li .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.li .t{font-weight:600;line-height:1.25}
.li .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.li .no{font-family:var(--f-disp);font-size:24px;font-weight:700;color:var(--lake-2);width:22px;flex:none;text-align:center}
.chev{color:var(--muted);flex:none}
.badge{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.05em;padding:2px 6px;border-radius:5px;background:var(--lake-soft);color:var(--lake-2);flex:none;text-transform:uppercase}
.badge.new{background:var(--lake-soft)} .badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.ok{background:var(--ok-soft);color:var(--ok)}
.pct{font-family:var(--f-disp);font-size:19px;font-weight:700;min-width:44px;text-align:right}
.val{font-family:var(--f-disp);font-size:22px;font-weight:700;color:var(--lake-2);text-align:right;white-space:nowrap}

/* Frage */
.qbar{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.back{display:flex;align-items:center;gap:2px;color:var(--lake-2);font-weight:600;padding:6px 4px 6px 0}
.qbar .sp{flex:1}
.qtext{font-size:20px;font-weight:600;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;line-height:1.4;width:100%}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);border:1px solid var(--line);font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--muted)}
.opt.sel{border-color:var(--lake-2);background:var(--lake-soft)} .opt.sel .k{background:var(--lake-2);border-color:var(--lake-2);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.expl{border-radius:12px;padding:13px 14px;background:var(--lake-soft);line-height:1.45}
.expl.ok{background:var(--ok-soft)} .expl.bad{background:var(--bad-soft)}
.expl b{display:block;font-family:var(--f-disp);font-size:20px;margin-bottom:2px}
.expl.ok b{color:var(--ok)} .expl.bad b{color:var(--bad)}
.timer{font-family:var(--f-mono);font-weight:600;color:var(--ink)} .timer.low{color:var(--bad)}

/* Bilder */
.qfig{margin:0;display:flex;flex-direction:column;gap:6px}
.qimg{background:#fff;border-radius:10px;padding:8px;border:1px solid var(--line);display:flex;justify-content:center;position:relative;overflow:hidden}
.qimg img{width:100%;max-width:640px;height:auto;cursor:zoom-in;display:block}
.qimg .crop{width:100%;max-width:640px;overflow:hidden}
.zoomhint{position:absolute;right:8px;bottom:8px;font:500 .7rem var(--f-mono);background:rgba(10,40,36,.75);color:#fff;border-radius:6px;padding:2px 6px;pointer-events:none}
.figbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.figtoggle{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:600;font-size:.82rem;color:var(--lake-2)}
.credit{min-width:0;overflow-wrap:anywhere} .credit a{color:var(--muted)}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(4,16,14,.94);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lightbox img{background:#fff;border-radius:8px;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}

/* Prüfung */
.grid60{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.grid60 button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 0;font:600 .72rem var(--f-mono);color:var(--muted)}
.grid60 button.done{background:var(--lake-soft);border-color:var(--lake-soft);color:var(--lake-2)}
.grid60 button.cur{outline:2px solid var(--lure);outline-offset:1px}
.pill{display:inline-block;padding:3px 12px;border-radius:20px;font-weight:700;font-size:15px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
details summary{cursor:pointer;font-weight:600;color:var(--lake-2)}
details p{margin-top:8px}
.confirm{border:1px solid var(--bad);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}

/* Katalog */
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--lake-2);border-color:var(--lake-2);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#06201c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#06201c}}
.kat ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:15px}
.kat li{color:var(--muted)} .kat li.k{color:var(--ok);font-weight:600}
mark{background:var(--lake-soft);color:inherit;border-radius:3px}

/* Tab-Leiste */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .row{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="true"]{color:var(--lake-2)}
.tab .dot{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-family:var(--f-mono);display:grid;place-items:center}
@media (prefers-reduced-motion:no-preference){.opt,.li,.chip{transition:background .12s,border-color .12s}}
</style>

</head>
<body>
<header class="top"><div class="inner">
  <svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" fill="#0f7a6d"/><path d="M150 240 L84 182 Q98 240 84 298 Z" fill="#f4fbf9"/><path d="M138 240 C190 146 352 136 428 240 C352 344 190 334 138 240 Z" fill="#f4fbf9"/><path d="M232 168 Q268 116 330 156 Q286 160 262 178 Z" fill="#f4fbf9"/><circle cx="376" cy="226" r="13" fill="#074640"/><path d="M206 246 L246 284 L318 204" fill="none" stroke="#0b6e63" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><path d="M96 380 Q136 360 176 380 T256 380 T336 380 T416 380" fill="none" stroke="#f08a3c" stroke-width="14" stroke-linecap="round"/></svg>
  <div class="grow"><h1>Fischerprüfung</h1><p>Bayern · amtlicher Katalog 2026</p></div>
  <button class="themeBtn" id="themeBtn" aria-label="Hell oder dunkel umschalten"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path id="themeIco" d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
  <div class="ring" title="sicher gelernt"><svg width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="5"/><circle id="ringArc" cx="24" cy="24" r="20" fill="none" stroke="#f08a3c" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 126" transform="rotate(-90 24 24)"/></svg><span id="ringTxt">0%</span></div>
</div></header>

<main class="inner"><div id="view" class="stack"><div class="card"><p class="muted">Fragen werden geladen …</p></div></div></main>

<nav class="tabs" aria-label="Bereiche"><div class="row">
  <button class="tab" data-go="start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>Start</button>
  <button class="tab" data-go="lernen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4z"/><path d="M20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/></svg>Lernen</button>
  <button class="tab" data-go="pruefung"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>Prüfung</button>
  <button class="tab" data-go="fehler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Fehler<span class="dot" id="errDot" hidden></span></button>
  <button class="tab" data-go="katalog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Katalog</button>
</div></nav>

<script>
const AREAS={1:"Fischkunde",2:"Gewässerkunde",3:"Gewässerschutz & Hege",4:"Fanggeräte & Fischbehandlung",5:"Rechtsvorschriften"};
const KEY="fp-bayern-v1";
const CHEV='<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>';
const BACK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg>';
let Q=[],BY={},S={p:{},exams:[]},FOTO={},exam=null,timerId=null,sess=null;
const ORIGVIEW=new Set();
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||"null");if(d&&d.p)S=d}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const st=id=>S.p[id]||{b:0,n:0,w:0,t:0};
const level=id=>{const s=st(id);return s.n===0?"new":s.b>=2?"sure":s.b===0?"weak":"learn"};
function record(id,ok){const s={...st(id)};s.n++;s.t=Date.now();if(ok)s.b=Math.min(s.b+1,5);else{s.b=0;s.w++}S.p[id]=s;save();header()}
const weakIds=()=>Q.filter(q=>level(q.id)==="weak");
function statsFor(list){const c={new:0,sure:0,learn:0,weak:0};list.forEach(q=>c[level(q.id)]++);return c}
function header(){
  const k=Q.filter(q=>level(q.id)==="sure").length,p=Q.length?Math.round(k/Q.length*100):0;
  $("#ringArc").setAttribute("stroke-dasharray",`${(p/100*125.7).toFixed(1)} 126`);$("#ringTxt").textContent=p+"%";
  const e=weakIds().length,d=$("#errDot");d.hidden=!e;d.textContent=e>99?"99+":e;
}
const V=h=>{$("#view").innerHTML=h;window.scrollTo(0,0)};

/* ---------- Routing ---------- */
const VIEWS=["start","lernen","pruefung","fehler","katalog"];
let view="start";
function go(v){
  if(!VIEWS.includes(v))v="start";view=v;
  document.onkeydown=null;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current",b.dataset.go===v));
  if(v==="pruefung")return exam?(exam.done?viewResult():viewExamQ()):viewPruefung();
  if(v!=="lernen")sess=null;
  ({start:viewStart,lernen:()=>sess?renderLearnQ():viewLernen(),fehler:viewFehler,katalog:viewKatalog})[v]();
}
function nav(v){if(location.hash.slice(1)===v)go(v);else location.hash=v}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{if(b.dataset.go==="lernen")sess=null;nav(b.dataset.go)});
addEventListener("hashchange",()=>go(location.hash.slice(1)));

/* ---------- Bausteine ---------- */
function areaList(){
  return `<div class="list">${[1,2,3,4,5].map(g=>{const l=BY[g],c=statsFor(l),p=Math.round(c.sure/l.length*100),w=c.weak/l.length*100;
    return `<button class="li" data-area="${g}"><span class="no">${g}</span><div class="body"><span class="t">${AREAS[g]}</span>
      <div class="bar thin"><i style="width:${p}%"></i><i class="w" style="width:${w.toFixed(1)}%"></i></div>
      <span class="meta"><span>${c.sure} von ${l.length} sicher</span>${c.weak?`<span style="color:var(--bad)">${c.weak} falsch</span>`:""}</span></div>
      <span class="pct num">${p}%</span>${CHEV}</button>`}).join("")}</div>`;
}
function bindAreas(){document.querySelectorAll("[data-area]").forEach(b=>b.onclick=()=>startLearn({area:+b.dataset.area}))}

/* ---------- Start ---------- */
function viewStart(){
  const c=statsFor(Q),p=Math.round(c.sure/Q.length*100),seen=Q.length-c.new,err=c.weak,last=S.exams[S.exams.length-1];
  V(`
  <section class="card">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
      <div><p class="small muted">Sicher gelernt</p><div class="big num">${p}<span style="font-size:28px">%</span></div></div>
      <p class="small muted" style="text-align:right">${c.sure} von ${Q.length} Fragen<br>${seen} schon gesehen</p>
    </div>
    <div class="bar"><i style="width:${p}%"></i></div>
    <div class="btns"><button class="btn" id="goAll">Weiterlernen</button><button class="btn ghost" id="goErr" ${err?"":"disabled"}>${err} Fehler</button></div>
    ${last?`<p class="small muted">Letzte Simulation: <b class="num">${last.score}/60</b> · ${last.pass?"bestanden":"nicht bestanden"}</p>`:""}
  </section>

function viewLernen(){

  V(`<div class="sec-h" style="margin-top:0"><h2>Was willst du lernen?</h2></div>

  ${areaList()}
  <p class="small muted">Falsch beantwortete Fragen kommen nach kurzer Pause wieder, danach neue Fragen. Nach jeder Antwort siehst du die Erklärung.</p>`);
  bindAreas();$("#goAll").onclick=()=>startLearn({});$("#goImg").onclick=()=>startLearn({img:true});
}
function poolFor(o){if(o.ids)return o.ids.map(id=>Q.find(q=>q.id===id)).filter(Boolean);if(o.weak)return weakIds();let l=o.area?BY[o.area]:Q;if(o.img)l=l.filter(q=>q.img);return l}
function startLearn(o){sess={o,title:o.title||(o.weak?"Fehler wiederholen":o.img?"Bildfragen":o.area?AREAS[o.area]:"Alles gemischt"),recent:[],n:0,ok:0,cur:null,ans:null,back:o.back||"lernen"};
  if(view!=="lernen"){view="lernen";document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current",b.dataset.go==="lernen"));history.replaceState(null,"","#lernen")}
  nextQ()}
function nextQ(){
  const pool=poolFor(sess.o);if(!pool.length){sess=null;return viewRoundEnd(true)}
  const P=pool.filter(q=>!sess.recent.includes(q.id)),src=P.length?P:pool,now=Date.now();
  const score=q=>{const s=st(q.id);if(s.n&&s.b===0)return Math.random();if(!s.n)return 1+Math.random();return 2+s.b*1.2-Math.min((now-s.t)/864e5,3)*.3+Math.random()*.8};
  let best=null,bs=1e9;for(const q of src){const v=score(q);if(v<bs){bs=v;best=q}}
  sess.cur=best;sess.ans=null;renderLearnQ()}
function viewRoundEnd(empty){V(`<section class="card"><h2 style="font-size:28px">${empty?"Keine Fragen mehr offen":"Runde beendet"}</h2>${empty?`<p class="muted">Alle Fehler sind abgearbeitet.</p>`:""}<div class="btns"><button class="btn" id="a">Weiterlernen</button><button class="btn ghost" id="h">Zur Übersicht</button></div></section>`);$("#a").onclick=()=>startLearn({});$("#h").onclick=()=>nav("start")}
function tagFor(id){const l=level(id);return l==="new"?'<span class="badge new">neu</span>':l==="weak"?'<span class="badge bad">zuletzt falsch</span>':l==="sure"?'<span class="badge ok">sicher</span>':'<span class="badge">in Arbeit</span>'}
function renderLearnQ(){
  const q=sess.cur,a=sess.ans;
  V(`<div class="qbar"><button class="back" id="backBtn">${BACK}Beenden</button><span class="sp"></span><span class="num">${sess.ok}/${sess.n} ✓</span></div>
    <section class="card">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="badge">${q.id}</span><span class="small muted">${AREAS[q.g]}</span><span class="sp" style="flex:1"></span>${tagFor(q.id)}</div>
      <p class="qtext">${esc(q.q)}</p>${qImg(q)}
    </section>
    <div class="opts">${q.a.map((t,i)=>{let c="";if(a!==null){if(i===q.k)c="right";else if(i===a)c="wrong"}
      return `<button class="opt ${c}" data-i="${i}" ${a!==null?"disabled":""}><span class="k">${"ABC"[i]}</span><span>${esc(t)}</span></button>`}).join("")}</div>
    <div id="after" class="stack">${a!==null?`<div class="expl ${a===q.k?"ok":"bad"}"><b>${a===q.k?"Richtig":"Leider falsch – richtig ist "+"ABC"[q.k]}</b>${esc(q.e)}</div><button class="btn" id="next">Weiter</button>`:""}</div>`);
  $("#backBtn").onclick=()=>{const b=sess.back;sess=null;nav(b)};
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerLearn(+b.dataset.i));
  if(a!==null){$("#next").onclick=nextQ;$("#next").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"end"})}
  document.onkeydown=e=>{if(e.metaKey||e.ctrlKey||e.target.matches("input"))return;const k="abc123".indexOf(e.key.toLowerCase());
    if(sess&&sess.ans===null&&k>=0){e.preventDefault();answerLearn(k%3)}else if(sess&&sess.ans!==null&&e.key==="Enter"){e.preventDefault();nextQ()}};
}
function answerLearn(i){if(!sess||sess.ans!==null)return;const q=sess.cur,ok=i===q.k;sess.ans=i;sess.n++;if(ok)sess.ok++;record(q.id,ok);
  sess.recent.push(q.id);if(sess.recent.length>(ok?6:4))sess.recent.shift();renderLearnQ()}

function fotoImg(f,q){if(!f.crop)return `<img src="${f.u}" alt="Foto zu Frage ${q.id}" loading="lazy" data-zoom="1" referrerpolicy="no-referrer">`;
  const [x,y,w,h]=f.crop,ar=f.ar||1;
  return `<div class="crop" style="aspect-ratio:${(w/(h*ar)).toFixed(3)}"><img src="${f.u}" alt="Foto zu Frage ${q.id}" loading="lazy" data-zoom="1" referrerpolicy="no-referrer" style="width:${(100/w).toFixed(2)}%;max-width:none;margin-left:-${(x/w*100).toFixed(2)}%;margin-top:-${(y*ar/w*100).toFixed(2)}%"></div>`}
function qImg(q){if(!q.img)return "";const f=FOTO[q.id],orig=!f||ORIGVIEW.has(q.id);
  const main=orig?`<img src="${q.img}" alt="Abbildung zu Frage ${q.id}" loading="lazy" data-zoom="1">`:fotoImg(f,q);
  return `<figure class="qfig"><div class="qimg">${main}<span class="zoomhint">Antippen = groß</span></div>${f?`<div class="figbar"><button type="button" class="figtoggle" data-fig="${q.id}">${orig?"Scharfes Foto zeigen":"Prüfungsbild zeigen"}</button><span class="credit">${orig?"Original aus dem amtlichen Katalog":`Foto: ${esc(f.by)} · ${esc(f.lic)} · <a href="${f.src}" target="_blank" rel="noopener">Quelle</a>`}</span></div>`:""}</figure>`}
document.addEventListener("click",e=>{
  const t=e.target.closest&&e.target.closest(".figtoggle");
  if(t){const id=t.dataset.fig;ORIGVIEW.has(id)?ORIGVIEW.delete(id):ORIGVIEW.add(id);const q=Q.find(x=>x.id===id),fig=t.closest("figure");if(q&&fig)fig.outerHTML=qImg(q);return}
  const im=e.target.closest&&e.target.closest("img[data-zoom]");
  if(im){const lb=document.createElement("div");lb.className="lightbox";lb.setAttribute("role","dialog");lb.setAttribute("aria-label","Bild vergrößert");lb.innerHTML=`<img src="${im.getAttribute("src")}" alt="${esc(im.alt)}" referrerpolicy="no-referrer">`;lb.onclick=()=>lb.remove();document.body.appendChild(lb)}
});
addEventListener("keydown",e=>{if(e.key==="Escape"){const lb=$(".lightbox");if(lb)lb.remove()}});

function submitExam(){if(!exam||exam.done)return;clearInterval(timerId);exam.done=true;
